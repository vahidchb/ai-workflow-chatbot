<main class="chat">
  <header>
    <h1>چت‌بات آموزشی AI Engineering</h1>
    <p>Tool calling با Tavily • مدیریت توکن • Compaction • Eval با LangSmith</p>
    <p class="tokens">توکن‌ها: {{ tokens() }} / {{ maxTokens() }}</p>
  </header>

  <section class="messages">
    @for (msg of messages(); track $index) {
      <div class="message" [class.user]="msg.role === 'user'" [class.bot]="msg.role === 'bot'">
        <p>{{ msg.text }}</p>
        @if (msg.usedTool) {
          <span class="tool">🔍 از ابزار سرچ مقاله استفاده شد</span>
        }
      </div>
    }
    @if (loading()) {
      <div class="message bot"><p>در حال فکر کردن…</p></div>
    }
  </section>

  <footer>
    <input
      [(ngModel)]="input"
      (keyup.enter)="send()"
      placeholder="پیامت را بنویس…"
      [disabled]="loading()"
    />
    <button (click)="send()" [disabled]="loading()">ارسال</button>
    <button class="example" (click)="askExample()" [disabled]="loading()">
      مثال: سرچ مقاله
    </button>
  </footer>
</main>
