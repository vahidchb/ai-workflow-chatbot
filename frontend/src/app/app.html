<main class="chat">
  <header>
    <h1>چت‌بات آموزشی</h1>
    <p class="subtitle">Tool calling • مدیریت توکن • Compaction • Eval با LangSmith</p>
    <div class="token-bar">
      <div class="token-fill" [style.width.%]="tokenPercent()"></div>
    </div>
    <p class="tokens">توکن‌ها: {{ tokens() }} از {{ maxTokens() }}</p>
  </header>

  <section class="messages">
    @for (msg of messages(); track $index) {
      <div class="message" [class.user]="msg.role === 'user'" [class.bot]="msg.role === 'bot'">
        <p>{{ msg.text }}</p>
        @if (msg.usedTool) {
          <span class="tool">🔍 از ابزار سرچ مقاله استفاده شد</span>
        }
      </div>
    }
    @if (loading()) {
      <div class="message bot typing"><p>در حال فکر کردن…</p></div>
    }
  </section>

  <footer>
    <div class="composer">
      <input
        [(ngModel)]="input"
        (keyup.enter)="send()"
        placeholder="پیامت را بنویس…"
        [disabled]="loading()"
      />
      <button (click)="send()" [disabled]="loading()">ارسال</button>
    </div>
    <div class="example-row">
      <button (click)="askExample()" [disabled]="loading()">
        مثال: مقاله جدید درباره هوش مصنوعی پیدا کن
      </button>
    </div>
  </footer>
</main>
